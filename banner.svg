<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="100%" role="img" aria-label="Nguyen Huu Tri - Data Science" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b1b4d"/>
      <stop offset="0.45" stop-color="#8e3b6e"/>
      <stop offset="0.75" stop-color="#e8644a"/>
      <stop offset="1" stop-color="#ffb35c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd27a" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffd27a" stop-opacity="0"/>
    </radialGradient>
    <symbol id="pine" viewBox="0 0 40 100">
      <polygon points="20,0 32,30 26,30 36,55 28,55 40,85 23,85 23,100 17,100 17,85 0,85 12,55 4,55 14,30 8,30"/>
    </symbol>
    <style>
      .star { animation: twinkle 3s ease-in-out infinite; }
      .s2 { animation-delay: .7s; } .s3 { animation-delay: 1.4s; } .s4 { animation-delay: 2.1s; }
      @keyframes twinkle { 0%,100% { opacity: .2 } 50% { opacity: 1 } }
      .sun { animation: pulse 5s ease-in-out infinite; transform-origin: 500px 215px; }
      @keyframes pulse { 0%,100% { transform: scale(1); opacity: .85 } 50% { transform: scale(1.12); opacity: 1 } }
      .cloud { animation: drift 40s linear infinite; }
      .c2 { animation-duration: 55s; animation-delay: -20s; }
      @keyframes drift { from { transform: translateX(-250px) } to { transform: translateX(1250px) } }
      .bird { animation: fly 18s linear infinite; }
      .b2 { animation-delay: -9s; }
      @keyframes fly { from { transform: translate(-60px, 0) } 50% { transform: translate(500px, -25px) } to { transform: translate(1060px, 10px) } }
      .sway { animation: sway 4s ease-in-out infinite; transform-box: fill-box; transform-origin: bottom center; }
      .sw2 { animation-delay: -1.3s; } .sw3 { animation-delay: -2.6s; }
      @keyframes sway { 0%,100% { transform: rotate(-1.2deg) } 50% { transform: rotate(1.2deg) } }
      .deer { animation: head 6s ease-in-out infinite; transform-box: fill-box; transform-origin: 20% 100%; }
      @keyframes head { 0%,70%,100% { transform: rotate(0) } 80%,90% { transform: rotate(-6deg) } }
      .title { animation: rise 1.6s ease-out both; }
      .sub { animation: rise 1.6s .5s ease-out both; }
      @keyframes rise { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: translateY(0) } }
      .firefly { animation: float 6s ease-in-out infinite; }
      .f2 { animation-delay: -2s; } .f3 { animation-delay: -4s; }
      @keyframes float { 0%,100% { transform: translate(0,0); opacity: .2 } 50% { transform: translate(12px,-16px); opacity: 1 } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important } }
    </style>
  </defs>

  <rect width="1000" height="300" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#fff">
    <circle class="star" cx="80" cy="30" r="1.5"/>
    <circle class="star s2" cx="190" cy="60" r="1.2"/>
    <circle class="star s3" cx="300" cy="25" r="1.6"/>
    <circle class="star s4" cx="420" cy="50" r="1.2"/>
    <circle class="star s2" cx="620" cy="28" r="1.5"/>
    <circle class="star" cx="740" cy="62" r="1.3"/>
    <circle class="star s3" cx="860" cy="30" r="1.6"/>
    <circle class="star s4" cx="940" cy="70" r="1.2"/>
    <circle class="star s2" cx="540" cy="14" r="1.1"/>
  </g>

  <!-- sun -->
  <circle class="sun" cx="500" cy="215" r="140" fill="url(#glow)"/>
  <circle cx="500" cy="215" r="48" fill="#ffd27a"/>

  <!-- clouds -->
  <g fill="#ffb7a0" opacity=".45">
    <g class="cloud"><ellipse cx="0" cy="120" rx="60" ry="9"/><ellipse cx="30" cy="112" rx="40" ry="8"/></g>
    <g class="cloud c2"><ellipse cx="0" cy="85" rx="70" ry="8"/><ellipse cx="-25" cy="78" rx="35" ry="7"/></g>
  </g>

  <!-- birds -->
  <g fill="none" stroke="#2b1b3d" stroke-width="2" stroke-linecap="round">
    <path class="bird" d="M0 100 q6 -8 12 0 q6 -8 12 0"/>
    <path class="bird b2" d="M0 140 q5 -7 10 0 q5 -7 10 0"/>
  </g>

  <!-- far mountains -->
  <path d="M0 220 L90 150 L170 200 L270 130 L380 205 L470 160 L560 210 L680 125 L790 200 L880 150 L1000 215 L1000 300 L0 300Z" fill="#6a2f66" opacity=".85"/>
  <!-- mid hills -->
  <path d="M0 250 Q150 190 300 235 T620 230 T1000 240 L1000 300 L0 300Z" fill="#4a2257"/>

  <!-- back trees -->
  <g fill="#3a1b4a">
    <use href="#pine" x="20" y="170" width="40" height="100" class="sway"/>
    <use href="#pine" x="70" y="185" width="34" height="85" class="sway sw2"/>
    <use href="#pine" x="250" y="180" width="36" height="90" class="sway sw3"/>
    <use href="#pine" x="330" y="190" width="30" height="80" class="sway"/>
    <use href="#pine" x="640" y="185" width="34" height="85" class="sway sw2"/>
    <use href="#pine" x="720" y="175" width="40" height="95" class="sway sw3"/>
    <use href="#pine" x="900" y="180" width="36" height="90" class="sway"/>
  </g>

  <!-- front ground -->
  <path d="M0 270 Q200 245 420 268 T1000 262 L1000 300 L0 300Z" fill="#1d0f2b"/>

  <!-- front trees -->
  <g fill="#1d0f2b">
    <use href="#pine" x="-10" y="120" width="70" height="175" class="sway sw2"/>
    <use href="#pine" x="50" y="150" width="55" height="140" class="sway"/>
    <use href="#pine" x="150" y="170" width="40" height="120" class="sway sw3"/>
    <use href="#pine" x="860" y="130" width="65" height="165" class="sway"/>
    <use href="#pine" x="930" y="110" width="80" height="185" class="sway sw2"/>
    <use href="#pine" x="800" y="175" width="40" height="115" class="sway sw3"/>
  </g>

  <!-- deer on right hill -->
  <g fill="#1d0f2b" stroke="#1d0f2b" stroke-linecap="round">
    <ellipse cx="715" cy="238" rx="22" ry="9" stroke="none"/>
    <path d="M697 244 v22 M705 246 v20 M727 246 v20 M735 244 v22" stroke-width="2.5" fill="none"/>
    <g class="deer">
      <path d="M730 234 L744 212 L752 215 L738 240Z" stroke="none"/>
      <ellipse cx="752" cy="211" rx="8" ry="5" transform="rotate(25 752 211)" stroke="none"/>
      <path d="M748 207 l-4 -14 m2 8 l-8 -6 m10 4 l6 -12 m-3 8 l9 -4" stroke-width="1.6" fill="none"/>
    </g>
  </g>

  <!-- fireflies -->
  <g fill="#ffe9a8">
    <circle class="firefly" cx="200" cy="245" r="2"/>
    <circle class="firefly f2" cx="400" cy="255" r="2"/>
    <circle class="firefly f3" cx="620" cy="250" r="2"/>
    <circle class="firefly f2" cx="820" cy="240" r="2"/>
  </g>

  <!-- text -->
  <g text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" fill="#fff">
    <text class="title" x="500" y="105" font-size="44" font-weight="700" style="text-shadow:0 2px 8px rgba(0,0,0,.4)">Nguyen Huu Tri</text>
    <text class="sub" x="500" y="140" font-size="20" fill="#ffe9d0">Data Science · Ho Chi Minh City</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
